spring:
  application:
    name: rutaexpress
  profiles:
    default: dev
  threads:
    virtual:
      enabled: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rutaexpress}
    username: ${DB_USER:rutaexpress}
    password: ${DB_PASSWORD:rutaexpress}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 5000
      max-lifetime: 1800000
      pool-name: rutaexpress-pool
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none # el esquema lo gestiona Flyway
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          time_zone: UTC
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 50
        query:
          in_clause_parameter_padding: true
          fail_on_pagination_over_collection_fetch: true
        generate_statistics: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  cache:
    type: ${CACHE_TYPE:simple}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: true
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:not-configured}
      chat:
        options:
          model: ${ASSISTANT_MODEL:claude-sonnet-5-5}
          max-tokens: 600
          temperature: 0.2
    mcp:
      server:
        enabled: true
        name: rutaexpress
        version: 0.1.0
        type: SYNC
        instructions: "Herramientas de reparto de RutaExpress para el repartidor autenticado."
        sse-endpoint: /mcp/sse
        sse-message-endpoint: /mcp/message
        capabilities:
          tool: true
          resource: true
          prompt: true
          completion: false

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: application/json,application/problem+json
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: rutaexpress
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 0.1

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json

rutaexpress:
  security:
    jwt-secret: ${JWT_SECRET:dev-only-secret-change-me-please-32-bytes-min!!}
    access-token-ttl: 15m
    refresh-token-ttl: 14d
    personal-token-ttl: 90d
    max-login-attempts: 5
    lock-duration: 15m
    cors-allowed-origins: ${CORS_ORIGINS:http://localhost:4200,http://localhost:4201}
  geo:
    osrm-url: ${OSRM_URL:http://localhost:5000}
    nominatim-url: ${NOMINATIM_URL:https://nominatim.openstreetmap.org}
    nominatim-public: ${NOMINATIM_PUBLIC:true}
    user-agent: ${NOMINATIM_USER_AGENT:RutaExpress/0.1 (proyecto academico)}
    country-codes: es
    fallback-enabled: ${GEO_FALLBACK:true}
    fallback-speed-kmh: 25
    fallback-detour-factor: 1.35
    min-geocode-confidence: 0.5
    timeout: 10s
  routing:
    algorithm: ${ROUTING_ALGORITHM:OR_TOOLS}
    time-limit: 3s
    return-to-depot: true
    base-service-seconds: 120
    per-parcel-seconds: 30
    min-reoptimize-interval: 5m
  tracking:
    deviation-meters: 350
    deviation-samples: 3
    retention-days: 30
  storage:
    type: ${STORAGE_TYPE:local}
    local:
      path: ${STORAGE_PATH:./data/proofs}
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:rutaexpress}
      secret-key: ${MINIO_SECRET_KEY:rutaexpress-secret}
      bucket: ${MINIO_BUCKET:proofs}
  privacy:
    recipient-retention: P90D
  assistant:
    enabled: ${ASSISTANT_ENABLED:false}
  rate-limit:
    ai-per-minute: 30
  demo:
    enabled: false

logging:
  level:
    com.rutaexpress: INFO
    org.hibernate.SQL: WARN

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: false
management:
  health:
    redis:
      enabled: false # en desarrollo la caché es en memoria y Redis puede no estar levantado
logging:
  level:
    com.rutaexpress: DEBUG
rutaexpress:
  demo:
    enabled: true

---
spring:
  config:
    activate:
      on-profile: docker
  cache:
    type: redis
rutaexpress:
  geo:
    nominatim-public: ${NOMINATIM_PUBLIC:false}
  storage:
    type: minio
  demo:
    enabled: ${DEMO_DATA:true}

---
spring:
  config:
    activate:
      on-profile: prod
  cache:
    type: redis
springdoc:
  swagger-ui:
    enabled: false
rutaexpress:
  security:
    # En producción el secreto es obligatorio: sin valor por defecto
    jwt-secret: ${JWT_SECRET}
  geo:
    fallback-enabled: false
  storage:
    type: minio
  demo:
    enabled: ${DEMO_DATA:false}
