name: Seguridad

on:
  pull_request:
  push:
    branches: [main, dev]
  schedule:
    # Cada lunes: avisa de vulnerabilidades nuevas aunque no se toque el código
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  secrets:
    # Este nombre es un check obligatorio de la protección de main: si se cambia, hay que cambiarlo allí también
    name: Secretos en el historial de Git
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 \
            git /repo --redact --no-banner --config /repo/.gitleaks.toml

  dependencies:
    # Este nombre es un check obligatorio de la protección de main: si se cambia, hay que cambiarlo allí también
    name: Dependencias con vulnerabilidades
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # Falla si hay vulnerabilidades altas o críticas en las dependencias de producción del frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      # frontend/package-lock.json y backend/pom.xml contra la base de datos de vulnerabilidades OSV (Google)
      - name: OSV-Scanner (frontend y backend)
        run: |
          docker run --rm -v "$PWD:/src" ghcr.io/google/osv-scanner:v2.2.2 \
            scan source --recursive /src
