global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: rutaexpress-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
