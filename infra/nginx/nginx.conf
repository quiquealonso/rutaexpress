# Configuración local (HTTP). En producción se usa nginx.prod.conf.template con HTTPS.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=public:10m rate=60r/m;

server {
    listen 80;
    server_name _;
    include /etc/nginx/snippets/common.inc;
}
